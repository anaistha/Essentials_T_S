# One file per dialect with the columns: Standard German, dialect, answer
data: [data/dialects/*.tsv, data/dialects/*.csv]
reference: de          # name of the Standard German questions in the results
results_dir: results

# What the model gets. For now only the question itself.
prompt: "{question}"

# Used when --thinking is not given: on, off or default (let the model decide)
thinking: ["off"]

# How many questions a model gets at the same time. slurm/run_ollama.submit lowers this if the model
# doesn't fit in GPU memory, because every parallel request needs its own memory.
parallel: 6

# Settings for every model. num_predict is the maximum number of tokens for thinking plus answer.
ollama_options: {temperature: 0, seed: 0, num_ctx: 40960, num_predict: 32768}

models:
# Gemma
# Sherif
  gemma4-e2b:       {tag: gemma4:e2b-it-q4_K_M}
# Sherif
  gemma4-e4b:       {tag: gemma4:e4b-it-q4_K_M}
# Anaïs
  gemma4-12b:       {tag: gemma4:12b-it-q4_K_M}
# Anaïs
  gemma4-26b-a4b:   {tag: gemma4:26b-a4b-it-q4_K_M}     # mixture of experts, only 4B parameters used per token
# Anaïs
  gemma4-31b:       {tag: gemma4:31b-it-q4_K_M}

# DeepSeek recommends temperature 0.6.
# always_thinks: the model thinks even with thinking off, so we skip thinking off for it.
# Sherif
  deepseek-r1-1.5b: {tag: deepseek-r1:1.5b-qwen-distill-q4_K_M, options: {temperature: 0.6}, always_thinks: true}
# Sherif
  deepseek-r1-7b:   {tag: deepseek-r1:7b-qwen-distill-q4_K_M, options: {temperature: 0.6}, always_thinks: true}
# Sherif
  deepseek-r1-8b:   {tag: deepseek-r1:8b-0528-qwen3-q4_K_M, options: {temperature: 0.6}}
# Anaïs
  deepseek-r1-14b:  {tag: deepseek-r1:14b-qwen-distill-q4_K_M, options: {temperature: 0.6}, always_thinks: true}
# Anaïs
  deepseek-r1-32b:  {tag: deepseek-r1:32b-qwen-distill-q4_K_M, options: {temperature: 0.6}, always_thinks: true}

# Qwen
# Sherif
  qwen3.5-0.8b:      {tag: qwen3.5:0.8b-q8_0, options: {temperature: 0.6}}
# Sherif
  qwen3.5-4b:        {tag: qwen3.5:4b-q4_K_M, options: {temperature: 0.6}}
# Sherif
  qwen3.5-9b:        {tag: qwen3.5:9b-q4_K_M, options: {temperature: 0.6}}
# Anaïs
  qwen3.5-27b:       {tag: qwen3.5:27b-q4_K_M, options: {temperature: 0.6}}
# Anaïs
  qwen3.5-35b-a3b:   {tag: qwen3.5:35b-a3b-q4_K_M, options: {temperature: 0.6}}
# Anaïs
  qwen3.5-122b-a10b: {tag: qwen3.5:122b-a10b-q4_K_M, options: {temperature: 0.6}}
# Anaïs
  qwen3.8-27b:       {tag: qwen3.8:27b-q4_K_M, options: {temperature: 0.6}}

# Apertus (can't think)
# Sherif
  apertus-8b:       {tag: "hf.co/unsloth/Apertus-8B-Instruct-2509-GGUF:Q4_K_M"}
# Anaïs
  apertus-70b:      {tag: "hf.co/unsloth/Apertus-70B-Instruct-2509-GGUF:Q4_K_M"}

# Mistral
# Sherif
  ministral-3-3b:    {tag: ministral-3:3b-instruct-2512-q4_K_M}
# Sherif
  ministral-3-8b:    {tag: ministral-3:8b-instruct-2512-q4_K_M}
# Anaïs
  ministral-3-14b:   {tag: ministral-3:14b-instruct-2512-q4_K_M}
# Anaïs
  mistral-small-24b: {tag: mistral-small3.2:24b-instruct-2506-q4_K_M}
# Anaïs
  mistral-medium-128b: {tag: mistral-medium-3.5:128b-q4_K_M}
# Sherif
  mistral-large-4:   {tag: mistral-large-4:cloud}

